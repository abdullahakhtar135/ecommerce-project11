<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Home</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html" class="active">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Everyday tech, honest prices.</h2>
    <p>Laptops, accessories and audio delivered across the UAE.</p>
    <a class="btn" href="products.html">Shop all products</a>
  </section>

  <h2 class="section-title">Featured products</h2>
  <section class="product-grid" id="featured-products">
    <div class="product">
      <img src="images/laptop.svg" alt="Business Laptop">
      <h3>Business Laptop</h3>
      <p>AED 3,499</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="images/headphones.svg" alt="Noise-Cancelling Headphones">
      <h3>Noise-Cancelling Headphones</h3>
      <p>AED 549</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="images/monitor.svg" alt="27-inch Monitor">
      <h3>27-inch Monitor</h3>
      <p>AED 899</p>
      <button>Add to Cart</button>
    </div>
  </section>

  <footer class="site-footer"><p>&copy; 2025 ShopNow.</p></footer>
  <script src="js/app.js"></script>
</body>
</html>
