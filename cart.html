<!DOCTYPE html>
<html>
<head>
  <title>Cart</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart</a>
    <span id="auth-nav-slot"></span>
  </nav>

  <h1>Your Cart</h1>
  <div id="cart-items"></div>
  <h3>Subtotal: AED <span id="subtotal">0.00</span></h3>

  <script>
    function renderCart() {
      const cart = getCart();
      const container = document.getElementById("cart-items");
      if (cart.length === 0) {
        container.innerHTML = "<p>Your cart is empty.</p>";
        document.getElementById("subtotal").textContent = "0.00";
        return;
      }
      let subtotal = 0;
      container.innerHTML = cart.map(item => {
        subtotal += item.price * item.quantity;
        return `
          <div>
            <span>${item.name}</span>
            <input type="number" value="${item.quantity}"
              onchange="updateQuantity(${item.product_id}, this.value); renderCart();">
            <span>AED ${(item.price * item.quantity).toFixed(2)}</span>
            <button onclick="removeFromCart(${item.product_id}); renderCart();">Remove</button>
          </div>`;
      }).join('');
      document.getElementById("subtotal").textContent = subtotal.toFixed(2);
    }
    renderCart();
  </script>
</body>
</html>
