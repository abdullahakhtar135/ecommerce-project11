<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>ShopNow</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="about.html">About</a>
      <span id="auth-nav-slot"></span>
    </nav>
  </header>

  <main style="padding: 2rem;">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <h3>Subtotal: AED <span id="subtotal">0.00</span></h3>
    <button id="checkout-btn" onclick="checkout()">Checkout</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const container = document.getElementById("cart-items");
      if (cart.length === 0) {
        container.innerHTML = "<p>Your cart is empty.</p>";
        document.getElementById("subtotal").textContent = "0.00";
        return;
      }
      let subtotal = 0;
      container.innerHTML = cart.map(item => {
        subtotal += item.price * item.quantity;
        return `
          <div style="margin-bottom: 1rem;">
            <span>${item.name}</span>
            <input type="number" min="0" value="${item.quantity}"
              onchange="updateQuantity(${item.product_id}, this.value); renderCart();">
            <span>AED ${(item.price * item.quantity).toFixed(2)}</span>
            <button onclick="removeFromCart(${item.product_id}); renderCart();">Remove</button>
          </div>`;
      }).join('');
      document.getElementById("subtotal").textContent = subtotal.toFixed(2);
    }

    async function checkout() {
      const user = await requireLogin();
      if (user) alert("Logged in as " + user.email + ". Checkout will be built in Lab 6.");
    }

    renderCart();
  </script>
</body>
</html>
