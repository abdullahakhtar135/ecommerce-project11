<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Products</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html" class="active">Products</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <h2 class="page-title">All products</h2>
  <section class="product-grid" id="all-products">
    <div class="product">
      <img src="images/laptop.svg" alt="Business Laptop">
      <h3>Business Laptop</h3>
      <p>AED 3,499</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="images/mouse.svg" alt="Wireless Mouse">
      <h3>Wireless Mouse</h3>
      <p>AED 89</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="images/keyboard.svg" alt="Mechanical Keyboard">
      <h3>Mechanical Keyboard</h3>
      <p>AED 329</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="images/monitor.svg" alt="27-inch Monitor">
      <h3>27-inch Monitor</h3>
      <p>AED 899</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="images/headphones.svg" alt="Noise-Cancelling Headphones">
      <h3>Noise-Cancelling Headphones</h3>
      <p>AED 549</p>
      <button>Add to Cart</button>
    </div>
    <div class="product">
      <img src="images/hub.svg" alt="USB-C Hub">
      <h3>USB-C Hub</h3>
      <p>AED 149</p>
      <button>Add to Cart</button>
    </div>
  </section>

  <footer class="site-footer"><p>&copy; 2025 ShopNow.</p></footer>
  <script src="js/app.js"></script>
</body>
</html>
