<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>My Store</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <h2>Products</h2>

    <div class="controls">
      <input type="text" id="search-box" placeholder="Search products...">
      <select id="sort-select">
        <option value="default">Sort by price</option>
        <option value="low-high">Low to High</option>
        <option value="high-low">High to Low</option>
      </select>
    </div>

    <div class="categories">
      <button class="category-btn" data-category="All">All</button>
      <button class="category-btn" data-category="Computers">Computers</button>
      <button class="category-btn" data-category="Accessories">Accessories</button>
      <button class="category-btn" data-category="Phones">Phones</button>
    </div>

    <div id="product-list" class="product-grid"></div>
  </main>

  <footer><p>&copy; 2026 My Store</p></footer>

  <script src="js/app.js"></script>
</body>
</html>
